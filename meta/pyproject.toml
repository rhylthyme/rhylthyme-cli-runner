[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rhylthyme"
version = "0.2.4"
description = "Schedule work a person follows against a clock (recipes, lab protocols, run-of-shows, workouts) and publish it as a live timeline. Installs the rhylthyme command."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Jeremy Leipzig", email = "leipzig@gmail.com"}]
keywords = ["scheduling", "timeline", "recipes", "lab-protocols", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "rhylthyme-cli-runner>=0.2.6a0",
    "rhylthyme-importers>=0.4.5",
    "rhylthyme-timeline>=2.0.0b5",
]


[project.urls]
Homepage = "https://www.rhylthyme.com"
Documentation = "https://docs.rhylthyme.com"
Source = "https://github.com/rhylthyme/rhylthyme-cli-runner"

[tool.setuptools]
packages = []
